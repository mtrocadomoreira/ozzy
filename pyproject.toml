[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "ozzy-pic"
dynamic = ["version", "classifiers"]
description = "PIC simulation data analysis for the lazy and impatient"
authors = [{ name = "Mariana Moreira", email = "mtrocadomoreira@gmail.com" }]
license = "MIT"
readme = "README.md"
keywords = []
requires-python = ">=3.11,<3.16"
dependencies = [
  "xarray>=2024.1.0,<2027.0.0",
  "tqdm>=4.67.0,<5.0.0",
  "numba (>=0.68.0,<1.0)",
  "h5py>=3.11.0,<4.0.0",
  "h5netcdf>=1.4.0,<2.0.0",
  "flox>=0.9.0,<0.12.0",
  "dask>=2024.1.0,<2027",
  "dask-expr>=0.4.0,<3",
  "matplotlib>=3.9.0,<4.0.0",
  "cmcrameri",
  "seaborn>=0.13.0,<0.14.0",
  "numpy-groupies>=0.11.0,<0.14.0",
  "numbagg>=0.7.0,<0.10.0",
  "openpmd-viewer (>=1.10.0,<2.0.0)",
  "pint (>=0.24.0,<0.27.0)",
  "tol-colors (>=1.3.0,<3.0.0)",
  "hvplot>=0.10.0,<1.0",
  # not directly dependent, but declared here to exclude
  # versions with security vulnerabilities
  "pyarrow (>=26.0.1,<27.0.0)",
  "urllib3 (>=2.8.0,<3.0.0)",
  "gitpython (>=3.1.62,<4.0.0)",
  "tornado (>=6.5.9,<7.0.0)",
  "pillow (>=13.0.0,<14.0.0)",
  "certifi (>=2026.10.18,<2027.0.0)",
]

[project.urls]
homepage = "https://mtrocadomoreira.github.io/ozzy/"
repository = "https://github.com/mtrocadomoreira/ozzy.git"
documentation = "https://mtrocadomoreira.github.io/ozzy/"


[project.optional-dependencies]
interactive = [
  "ipython>=8.20.0,<10.0",
  "ipykernel>=6.29.0,<8.0",
  "jupyter-bokeh>=4.0.0,<5.0",
]


[tool.poetry]
requires-poetry = ">=2.0"
version = "2.1.8"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Framework :: Hypothesis",
  "Framework :: Pytest",
  "Framework :: IPython",
  "Framework :: Jupyter",
  "Framework :: Jupyter :: JupyterLab",
  "Framework :: Matplotlib",
  "Framework :: MkDocs",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft",
  "Operating System :: Unix",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Visualization",
]
packages = [{ include = "ozzy", from = "src" }]

[tool.semantic_release]
version_variables = ["src/ozzy/__init__.py:__version__"]
version_toml = ["pyproject.toml:tool.poetry.version"]
branch = "main"
assets = []
build_command = "pip install poetry && poetry build"
build_command_env = []
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
logging_use_named_masks = false
major_on_zero = true
allow_zero_version = true
no_git_verify = false
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog]
mode = "init"
template_dir = "templates"
exclude_commit_patterns = ["test", "style", "chore", '''Merge? .*''']

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = true

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <mtrocadomoreira@gmail.com>"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
  "chore",
  "docs",
  "feat",
  "fix",
  "perf",
  "style",
  "refactor",
  "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
default_bump_level = 0

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false
insecure = false

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true


[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]


[tool.ruff]


[dependency-groups]
docs = [
  "mkdocs-material (>=9.7.6,<10.0)",
  "mkdocstrings-python (>=2.0.5,<3.0)",
  "mkdocs-git-revision-date-localized-plugin (>=1.5.3,<2.0)",
  "mkdocs-glightbox (>=0.5.2,<1.0)",
  "mkdocs-include-markdown-plugin (>=7.3.0,<8.0)",
  "mkdocs-open-in-new-tab (>=1.0.8,<2.0.0)",
]
test = [
  "pytest (>=9.1.1,<10.0.0)",
  "hypothesis (>=6.156.6,<7.0)",
  "pytest-mock (>=3.15.1,<4.0.0)",
]
lint = ["ruff (>=0.15.21,<1.0)", "black (>=26.10.1,<27.0.0)"]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  "python-semantic-release (>=10.6.1,<11.0)",
  "setuptools (>=84.1.0,<85.0)",
]
